name: Arduino example builds

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ['3.3.13', '4.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.6.0'
      - name: Install the ESP32 core and utilities
        env:
          ARDUINO_CORE: ${{ matrix.core }}
        run: |
          index_url=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$index_url"
          arduino-cli core install "esp32:esp32@$ARDUINO_CORE" --additional-urls "$index_url"
          arduino-cli lib install --no-deps esp-lib-utils@0.2.3
      - name: Install IO Expander 1.1.1
        if: matrix.core == '3.3.13'
        run: arduino-cli lib install --no-deps ESP32_IO_Expander@1.1.1
      - name: Check out IO Expander with the new I2C driver
        if: matrix.core == '4.0.0'
        run: |
          expander="$RUNNER_TEMP/ESP32_IO_Expander"
          git init "$expander"
          git -C "$expander" fetch --depth 1 https://github.com/esp-arduino-libs/ESP32_IO_Expander.git e2028bb041b00665bf7b72dd8a8c84c22db4b303
          git -C "$expander" checkout --detach FETCH_HEAD
      - name: Build LCD examples and a supported board
        env:
          ARDUINO_CORE: ${{ matrix.core }}
        run: |
          libraries=(--library .)
          if [[ "$ARDUINO_CORE" == 4.0.0 ]]; then
            libraries+=(--library "$RUNNER_TEMP/ESP32_IO_Expander")
          fi
          arduino-cli compile "${libraries[@]}" --fqbn esp32:esp32:esp32c3 \
            examples/arduino/drivers/lcd/lcd_spi
          arduino-cli compile "${libraries[@]}" --fqbn esp32:esp32:esp32s3:PSRAM=opi \
            examples/arduino/drivers/lcd/lcd_single_rgb
          arduino-cli compile "${libraries[@]}" --fqbn esp32:esp32:esp32p4:ChipVariant=postv3,PSRAM=enabled \
            examples/arduino/drivers/lcd/lcd_mipi_dsi

          sketch="$RUNNER_TEMP/board_static_config"
          cp -R examples/arduino/board/board_static_config "$sketch"
          supported_conf="$sketch/esp_panel_board_supported_conf.h"
          drivers_conf="$sketch/esp_panel_drivers_conf.h"
          sed -i -E \
            -e 's/(#define ESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED[[:space:]]*)\(0\)/\1(1)/' \
            -e 's|^// (#define BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_4_3)$|\1|' \
            "$supported_conf"
          sed -i -E 's/(ESP_PANEL_DRIVERS_(LCD|TOUCH|EXPANDER)_USE_ALL[[:space:]]*)\(0\)/\1(1)/' "$drivers_conf"
          grep -Eq '^#define ESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED[[:space:]]+\(1\)$' "$supported_conf"
          grep -Fxq '#define BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_4_3' "$supported_conf"
          for driver in LCD TOUCH EXPANDER; do
            grep -Eq "^#define ESP_PANEL_DRIVERS_${driver}_USE_ALL[[:space:]]+\(1\)$" "$drivers_conf"
          done
          arduino-cli compile "${libraries[@]}" --fqbn esp32:esp32:esp32s3:PSRAM=opi "$sketch"
      - name: Build ESP32-S31 RGB888 and I2C touch examples
        if: matrix.core == '4.0.0'
        run: |
          arduino-cli compile --library . --library "$RUNNER_TEMP/ESP32_IO_Expander" \
            --fqbn esp32:esp32:esp32s31 examples/arduino/drivers/lcd/lcd_rgb_s31
          arduino-cli compile --library . --library "$RUNNER_TEMP/ESP32_IO_Expander" \
            --fqbn esp32:esp32:esp32s3:PSRAM=opi examples/arduino/drivers/touch/touch_i2c
      - name: Build the ESP-Mosaico board example
        if: matrix.core == '4.0.0'
        run: |
          arduino-cli compile --library . --library "$RUNNER_TEMP/ESP32_IO_Expander" \
            --fqbn esp32:esp32:esp32s31 examples/arduino/board/esp_mosaico
